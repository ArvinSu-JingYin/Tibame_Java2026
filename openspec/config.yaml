schema: spec-driven
githubCopilot:
  cloudAgent: true

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
context: |
  Tech stack: Java 17+, Spring Boot 3.x, Maven, Vue 3, Bootstrap 5.3
  Git commit convention: Follow Conventional Commits with Spring Boot scope and Traditional Chinese subject.
  Format: <type>(<scope>): <繁體中文簡述>
  Types: feat, fix, refactor, perf, test, style, docs, chore, revert
  Scopes: controller, service, repository, entity, dto, config, security, exception, view, common, build, specs
  Footer: Opsx: <change-name>

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
operations:
  apply:
    guidance:
      - Keep test summaries concise
      - When generating git commits, adhere strictly to .agents/rules/git-commit-rules.md
      - Never add redundant @Repository to JpaRepository interfaces
      - Cache regex Pattern as private static final and prevent dead fields
      - Ensure zero unused imports and zero compiler warnings before completing tasks
  archive:
    guidance:
      - Summarize the archive outcome before finishing

